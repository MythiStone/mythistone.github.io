<!-- Klaro consent helpers (MythiConsent). Needed by any page that sets an

<!-- Deep links: opens the modal/accordion/tab a #fragment points at, keeps the
     hash in sync, injects the copy-link buttons. Needs Bootstrap's Modal /

     their own state with window.MythiLink further down. -->
<script src="/assets/js/deep-link.js"></script>
<!-- Sidenav share buttons: points them at the current page (canonical + any open
     panel's #fragment) instead of the site root. After deep-link.js, whose hash
     it reads. -->
<script src="/assets/js/share.js"></script>
<!-- Infinite scroll helper (MythiInfinite): IntersectionObserver sentinel loader
     shared by the blog, items and routes listings. Defines a helper only; the
     pages that use it wire their own onLoadMore further down. -->
<script src="/assets/js/infinite-scroll.js"></script>
<script src="/assets/js/plugins/bootstrap-select.min.js"></script>
<script src="/assets/js/plugins/fuse.js"></script>
<script src="/assets/js/site-search.js"></script>
<!-- Top Trends ticker: clones the row to overfill the viewport and drives the
     seamless infinite scroll. First-party, no deps; harmless when no bar present. -->
<script src="/assets/js/trends-bar.js"></script>
<!-- Shared Chart.js helpers (MythiChart): palette, icon preloading, patch
     annotations, icon-label plugin. Defines helpers only; safe before Chart.js. -->
<script src="/assets/js/chart-theme.js"></script>
<!-- Smooth Scrollbar (used sparingly on sidenav) -->
<script src="/assets/js/plugins/smooth-scrollbar.min.js"></script>
