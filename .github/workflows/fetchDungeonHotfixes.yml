name: Fetch Dungeon Hotfixes

# Scrapes the latest official Blizzard hotfix notes and refreshes
# data/static/hotfixes.json, which the dungeon page generator reads directly.
# Credential-free (no DB, no secrets); runs daily so the per-dungeon "Latest
# Hotfixes" card stays fresh between the weekly static-data build.

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  fetch-hotfixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Fetch dungeon hotfixes
        run: python backend_scripts/fetchDungeonHotfixes.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git config pull.rebase true   # rebase
          git add data/static/hotfixes.json
          if git diff --cached --quiet; then
            echo "No hotfix changes to commit"
          else
            git commit -m "Update dungeon hotfixes"
            if ! git fetch --depth=1 origin main; then
              echo "Error during shallow fetch" >&2
              exit 1
            fi
            if ! git rebase origin/main; then
              echo "Error during rebase" >&2
              exit 1
            fi
            if ! git push; then
              echo "Error during git push" >&2
              exit 1
            fi
          fi
