name: Gather Static WoW data

on:
  schedule:
    - cron: '0 8 * * WED'
  workflow_dispatch:

jobs:
  gather-data:
    runs-on: ubuntu-latest
    env:
      BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
      BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
      RAIDERIO_API_KEY: ${{ secrets.RAIDERIO_API_KEY }}
      BLIZ_CLIENT_ID:     ${{ secrets.BLIZ_CLIENT_ID }}
      BLIZ_CLIENT_SECRET: ${{ secrets.BLIZ_CLIENT_SECRET }}
      DATABASE_HOST: ${{secrets.DATABASE_HOST}}  
      DATABASE_USER: ${{secrets.DATABASE_USER}} 
      DATABASE_PASSWORD: ${{secrets.DATABASE_PASSWORT}} 
      DATABASE_NAME: ${{secrets.DATABASE_NAME}} 
      DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install pandas
        run: pip install -c constraints.txt pandas requests aiohttp aiofiles aiolimiter mysql-connector-python pillow

      - name: Create data directory
        run: mkdir -p data

      - name: Download static files
        run: |
          curl -L "https://www.raidbots.com/static/data/live/talents.json" -o data/static/talents.json
          curl -L "https://www.raidbots.com/static/data/live/enchantments.json" -o data/static/enchantments.json
          curl -L "https://www.raidbots.com/static/data/live/equippable-items.json" -o data/static/equippable-items.json
          curl -L "https://www.raidbots.com/static/data/live/crafting.json" -o data/static/crafting.json
          curl -L "https://www.raidbots.com/static/data/live/bonuses.json" -o data/static/bonuses.json
          curl -L "https://www.raidbots.com/static/data/live/item-sets.json" -o data/static/item-sets.json
          curl -L "https://www.raidbots.com/static/data/live/flasks.json" -o data/static/flasks.json
          curl -L "https://www.raidbots.com/static/data/live/potions.json" -o data/static/potions.json
          curl -L "https://www.raidbots.com/static/data/live/foods.json" -o data/static/foods.json
          curl -L "https://www.raidbots.com/static/data/live/augments.json" -o data/static/augments.json
          curl -L "https://www.raidbots.com/static/data/live/temp-enchants.json" -o data/static/temp-enchants.json

      - name: process crafting data
        run: |
          python backend_scripts/processBonusIds.py
      - name: Build consumable catalog
        run: |
          python backend_scripts/processConsumables.py
      - name: Build food buff map
        run: |
          python backend_scripts/processFoodBuffs.py
      - name: Download consumable icons
        run: |
          python backend_scripts/downloadConsumableIcons.py
      - name: Download crafting icons
        run: |
          python backend_scripts/downloadCraftingIcons.py   
      
      - name: Download WoW talent icons
        run: |
          python backend_scripts/downloadIcons.py

      - name: Download Enchant & Socket Icons
        run: |
          python backend_scripts/downloadEnchantIcons.py

      - name: Download Equippable Item Icons
        run: |
          python backend_scripts/downloadItemIcons.py

      - name: Backfill missing talent icons
        env:
          BLIZ_CLIENT_ID:     ${{ secrets.BLIZ_CLIENT_ID }}
          BLIZ_CLIENT_SECRET: ${{ secrets.BLIZ_CLIENT_SECRET }}
        run: |
          python backend_scripts/backfillTalentIcons.py

      - name: Process Talents
        run: |
          python backend_scripts/processTalents.py

      - name: Download CSV
        run: |
          curl -L "https://wago.tools/db2/ChrSpecialization/csv" -o data/static/specs.csv
          curl -L "https://wago.tools/db2/ChrClasses/csv" -o data/static/classes.csv
          curl -L "https://wago.tools/db2/ManifestInterfaceData/csv" -o data/static/interfacedata.csv

      - name: Process CSV files
        env:
          BLIZ_CLIENT_ID:     ${{ secrets.BLIZ_CLIENT_ID }}
          BLIZ_CLIENT_SECRET: ${{ secrets.BLIZ_CLIENT_SECRET }}
        run: |
          python backend_scripts/processSpecs.py
          python backend_scripts/processClasses.py

      - name: Download Spec Icons
        env:
          CDN_BASE: https://render.worldofwarcraft.com/icons/56
        run: |
          python backend_scripts/downloadSpecIcons.py

      - name: Fetch dungeon metadata
        env:
          BLIZ_CLIENT_ID:     ${{ secrets.BLIZ_CLIENT_ID }}
          BLIZ_CLIENT_SECRET: ${{ secrets.BLIZ_CLIENT_SECRET }}
          DATABASE_HOST: ${{secrets.DATABASE_HOST}}  
          DATABASE_USER: ${{secrets.DATABASE_USER}} 
          DATABASE_PASSWORD: ${{secrets.DATABASE_PASSWORT}} 
          DATABASE_NAME: ${{secrets.DATABASE_NAME}} 
          DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
        run: |
          python backend_scripts/fetchDungeonData.py

      - name: Fetch dungeon spells
        env:
          DATABASE_HOST: ${{secrets.DATABASE_HOST}}
          DATABASE_USER: ${{secrets.DATABASE_USER}}
          DATABASE_PASSWORD: ${{secrets.DATABASE_PASSWORT}}
          DATABASE_NAME: ${{secrets.DATABASE_NAME}}
          DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
        run: |
          python backend_scripts/fetchDungeonSpells.py

      - name: Fetch player cooldowns
        run: |
          python backend_scripts/fetchPlayerCooldowns.py

      - name: Fetch raid metadata
        env:
          BLIZ_CLIENT_ID:     ${{ secrets.BLIZ_CLIENT_ID }}
          BLIZ_CLIENT_SECRET: ${{ secrets.BLIZ_CLIENT_SECRET }}
        run: |
          python backend_scripts/fetchRaidData.py

      - name: Fetch npc data
        env:
          DATABASE_HOST: ${{secrets.DATABASE_HOST}}  
          DATABASE_USER: ${{secrets.DATABASE_USER}} 
          DATABASE_PASSWORD: ${{secrets.DATABASE_PASSWORT}} 
          DATABASE_NAME: ${{secrets.DATABASE_NAME}} 
          DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
        run: |
          python backend_scripts/fetchNpcInfo.py

      - name: Fetch npc icons
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python backend_scripts/fetchNpcIcons.py

      - name: Fetch spell data
        env:
          BLIZ_CLIENT_ID:     ${{ secrets.BLIZ_CLIENT_ID }}
          BLIZ_CLIENT_SECRET: ${{ secrets.BLIZ_CLIENT_SECRET }}
          DATABASE_HOST: ${{secrets.DATABASE_HOST}}  
          DATABASE_USER: ${{secrets.DATABASE_USER}} 
          DATABASE_PASSWORD: ${{secrets.DATABASE_PASSWORT}} 
          DATABASE_NAME: ${{secrets.DATABASE_NAME}} 
          DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
        run: |
          python backend_scripts/fetchSpellInfo.py

      - name: Fetch commodity prices
        env:
          BLIZ_CLIENT_ID:     ${{ secrets.BLIZ_CLIENT_ID }}
          BLIZ_CLIENT_SECRET: ${{ secrets.BLIZ_CLIENT_SECRET }}
        run: |
          python backend_scripts/fetchCommodityPrices.py
      

      - name: Fetch season and period info
        env:
          BLIZ_CLIENT_ID:     ${{ secrets.BLIZ_CLIENT_ID }}
          BLIZ_CLIENT_SECRET: ${{ secrets.BLIZ_CLIENT_SECRET }}
          DATABASE_HOST: ${{secrets.DATABASE_HOST}}  
          DATABASE_USER: ${{secrets.DATABASE_USER}} 
          DATABASE_PASSWORD: ${{secrets.DATABASE_PASSWORT}} 
          DATABASE_NAME: ${{secrets.DATABASE_NAME}} 
          DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
        run: |
          python backend_scripts/fetchSeasonAndPeriodInfo.py

      - name: Fetch Mythic+ season cutoffs and score tiers
        run: |
          python backend_scripts/fetchMythicPlusCutoffs.py


      - name: Clean up CSV
        run: |
          rm data/static/specs.csv
          rm data/static/classes.csv
          rm data/static/interfacedata.csv

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git config pull.rebase true   # rebase
          # Reviewed by hand: only the cooldown-category-pr job below may propose changes to these.
          git add data/ \
            ':(exclude)data/static/player_cooldown_categories.json' \
            ':(exclude)data/static/player_cooldown_category_signals.json'
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Updated Static Data"
            # Pull latest changes, fail only on actual errors
            if ! git fetch --depth=1 origin main; then
              echo "Error during shallow fetch" >&2
              exit 1
            fi

            if ! git rebase origin/main; then
              echo "Error during rebase" >&2
              exit 1
            fi

            if ! git push; then
              echo "Error during git push" >&2
              exit 1
            fi
          fi

  cooldown-category-pr:
    needs: gather-data
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      PR_BRANCH: automation/cooldown-categories
      BOT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      CATEGORY_FILES: data/static/player_cooldown_categories.json data/static/player_cooldown_category_signals.json
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -c constraints.txt requests mysql-connector-python

      - name: Suggest cooldown categories
        run: |
          python backend_scripts/suggestCooldownCategories.py --pr-body "$RUNNER_TEMP/cooldown_categories_pr.md"

      - name: Detect changes
        id: changes
        run: |
          git add -- $CATEGORY_FILES
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new or changed cooldown categories"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(gh pr list --head "$PR_BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            git fetch --depth=1 origin "$PR_BRANCH"
            # A force push would discard the values someone edited in the open pull request.
            if [ "$(git log -1 --format=%ae FETCH_HEAD)" != "$BOT_EMAIL" ]; then
              echo "::notice::Pull request #$pr has manual edits, leaving it as it is"
              exit 0
            fi
          fi
          git config user.name "github-actions[bot]"
          git config user.email "$BOT_EMAIL"
          git commit -m "Suggest player cooldown categories"
          git push --force origin "HEAD:refs/heads/$PR_BRANCH"
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --body-file "$RUNNER_TEMP/cooldown_categories_pr.md"
          else
            gh pr create --base main --head "$PR_BRANCH" --title "Review player cooldown categories" \
              --body-file "$RUNNER_TEMP/cooldown_categories_pr.md"
          fi
